[project]
name = "retail-agent"
version = "0.1.0"
description = "CLI chat agent that answers retail analytics questions with SQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.47.0",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.27.0",
]

[project.scripts]
retail-agent = "retail_agent.cli:main"

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.7",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
